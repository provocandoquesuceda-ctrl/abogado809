name: EDAA Accelerated Delivery Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and local smoke test (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        id: setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Build application
        id: build
        run: npm run build

      - name: Start application locally
        id: start
        run: |
          npm run start > /tmp/abogado809-validation.log 2>&1 &
          echo $! > /tmp/abogado809-validation.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Local application is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/abogado809-validation.log
          exit 1

      - name: Smoke test critical route
        id: smoke
        run: node scripts/smoke-test.mjs http://127.0.0.1:3000

      - name: Create run evidence
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          START_OUTCOME: ${{ steps.start.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          mkdir -p validation-evidence
          {
            echo "# EDAA Accelerated Delivery Validation"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Deployment performed: NO"
            echo "- Install: ${INSTALL_OUTCOME:-not-run}"
            echo "- Build: ${BUILD_OUTCOME:-not-run}"
            echo "- Local start: ${START_OUTCOME:-not-run}"
            echo "- Smoke test: ${SMOKE_OUTCOME:-not-run}"
            echo "- Scope: dependency install, production build, local start and HTTP smoke test for /"
          } > validation-evidence/report.md

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edaa-accelerated-delivery-abogado809
          path: validation-evidence/report.md
          if-no-files-found: error
