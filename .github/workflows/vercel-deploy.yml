name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Deploy and Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run start > /tmp/abogado809.log 2>&1 &
          echo $! > /tmp/abogado809.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Local application is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/abogado809.log
          exit 1

      - name: Smoke test local
        run: node scripts/smoke-test.mjs http://127.0.0.1:3000

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .

      - name: Smoke test production
        env:
          PRODUCTION_URL: https://abogado809.vercel.app
        run: node scripts/smoke-test.mjs "$PRODUCTION_URL"

      - name: Operational evidence
        if: always()
        run: |
          mkdir -p evidence
          {
            echo "# Operational Evidence"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Production URL: https://abogado809.vercel.app"
            echo "- Pipeline: INSTALL -> BUILD -> START -> SMOKE -> DEPLOY -> PRODUCTION SMOKE -> EVIDENCE"
          } > evidence/operational-run.md

      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abogado809-operational-evidence
          path: evidence/operational-run.md
